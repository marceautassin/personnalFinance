  # `pr-reviewer` sur une COPIE de la base) : 0 bloquant, 4 majeurs, une dizaine de mineurs.
  # Tous traites. Le defaut central etait invisible a l'oeil ET aux tests :
  #   • `.bar__link` vit dans le style SCOPE d'`AppBar` : il n'atteignait pas le bouton de
  #     `AppBarMenu`, donc la section courante n'etait jamais surlignee. La classe, elle, etait
