  #   • `Tab` au-dela de la derniere entree laissait le menu ouvert : fermeture sur `focusout`.
  # Couverture : 15 cas E2E (7 au depart), dont `/reconciliation/<hash>` — la seule logique dont
  # la forme change — qui n'etait exercee par rien.
  # Verifications : 595 tests unitaires, 37 E2E (7 skipped), lint et typecheck propres.
